name: Build Portable EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate and Unify Files
        shell: pwsh
        run: |
          if (Test-Path "project") {
            Get-ChildItem -Path "project" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "." -Recurse -Force
            }
          }

          $entryCandidates = @(
            "src/main.tsx", "src/index.tsx", "src/App.tsx",
            "src/entry-client.tsx", "app/entry-client.tsx",
            "src/routes/__root.tsx", "app/routes/__root.tsx",
            "src/root.tsx", "app/root.tsx"
          )
          $entry = ""
          foreach ($cand in $entryCandidates) {
            if (Test-Path $cand) { $entry = $cand; break }
          }

          if (-not $entry) {
            $fallback = Get-ChildItem -Path @("src", "app", ".") -Include "*.tsx", "*.jsx" -Recurse | 
              Where-Object { $_.Name -notlike "*vite-env*" -and $_.FullName -notlike "*node_modules*" } | 
              Select-Object -First 1
            if ($fallback) {
              $entry = [System.IO.Path]::GetRelativePath((Get-Location).Path, $fallback.FullName).Replace("\", "/")
            }
          }

          Write-Host "Resolved React Entry: $entry"

          $html = "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>HarvestBot</title></head><body class='bg-background text-foreground'><div id='root'></div><script type='module' src='/$entry'></script></body></html>"
          Set-Content -Path "index.html" -Value $html -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python Engine
        run: |
          pip install pyinstaller fastapi uvicorn pydantic
          pyinstaller --noconsole --onefile --name "bot-engine" server.py
          copy dist\bot-engine.exe bot-engine.exe

      - name: Build Electron Executable
        run: |
          npm install --legacy-peer-deps
          npm install @tanstack/react-query @tanstack/react-router react-router-dom lucide-react clsx tailwind-merge sonner class-variance-authority tailwindcss @tailwindcss/postcss postcss autoprefixer @radix-ui/react-slot @radix-ui/react-tooltip @radix-ui/react-accordion @radix-ui/react-alert-dialog @radix-ui/react-aspect-ratio @radix-ui/react-avatar @radix-ui/react-checkbox @radix-ui/react-collapsible @radix-ui/react-context-menu @radix-ui/react-dialog @radix-ui/react-dropdown-menu @radix-ui/react-hover-card @radix-ui/react-label @radix-ui/react-menubar @radix-ui/react-navigation-menu @radix-ui/react-popover @radix-ui/react-progress @radix-ui/react-radio-group @radix-ui/react-scroll-area @radix-ui/react-select @radix-ui/react-separator @radix-ui/react-slider @radix-ui/react-switch @radix-ui/react-tabs @radix-ui/react-toggle @radix-ui/react-toggle-group react-day-picker embla-carousel-react recharts cmdk vaul input-otp react-resizable-panels react-hook-form @hookform/resolvers zod date-fns --legacy-peer-deps
          npm run dist

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: HarvestBot-App
          path: release/*.exe
