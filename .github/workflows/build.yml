name: Build Portable EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate and Unify Files
        shell: pwsh
        run: |
          if (Test-Path "project") {
            Get-ChildItem -Path "project" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "." -Recurse -Force
            }
          }
          if (-not (Test-Path "index.html")) {
            $entry = "src/main.tsx"
            if (Test-Path "src/index.tsx") { $entry = "src/index.tsx" }
            if (Test-Path "src/App.tsx") { $entry = "src/App.tsx" }
            $html = "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>HarvestBot</title></head><body class='bg-background text-foreground'><div id='root'></div><script type='module' src='/$entry'></script></body></html>"
            Set-Content -Path "index.html" -Value $html -Encoding utf8
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python Engine
        run: |
          pip install pyinstaller fastapi uvicorn pydantic
          pyinstaller --noconsole --onefile --name "bot-engine" server.py
          copy dist\bot-engine.exe bot-engine.exe

      - name: Build Electron Executable
        run: |
          npm install --legacy-peer-deps
          npm run dist

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: HarvestBot-App
          path: release/*.exe
